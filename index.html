<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda</title>
    <!-- Open Graph Tags for WhatsApp Preview -->
    <meta property="og:title" content="Mary y Andres" />
    <meta property="og:description" content="Click here to open." />
    <meta property="og:image" content="http://your_vps_public_ip/preview-thumbnail.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aasensio.github.io/bodorrio" />
    <style>
        /* DEFINICIÓN DE LA FUENTE */
        @font-face {
            font-family: 'MyWebFont';
            src: url('ArchitectsDaughter-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'MyWebFont';
            src: url('ArchitectsDaughter-Regular.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        
        body {
            margin: 0;
            padding: 20px; /* Reducido para pantallas pequeñas, se adapta en PC */
            background-color: #f8f9fa;
            font-family: 'MyWebFont', Courier, sans-serif;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Card Container */
        .card {
            display: flex;
            flex-direction: column; /* Por defecto apilado (móviles) */
            background: #ffffff;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            max-width: 1000px;
            width: 100%;
            gap: 24px;
            align-items: center;
            box-sizing: border-box;
        }

        /* Columna Izquierda: Imagen */
        .image-column {
            width: 100%; /* Ocupa todo el ancho en móviles */
        }

        .main-image {
            width: 100%;
            height: auto;
            border-radius: 16px;
            object-fit: cover;
            display: block;
        }

        /* Columna Derecha: Texto */
        .content-column {
            width: 100%; /* Ocupa todo el ancho en móviles */
            display: flex;
            flex-direction: column;
            gap: 24px; 
            text-align: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Typography */
        .description-text {
            font-size: 16px; /* Ligeramente más pequeño en móvil para legibilidad */
            line-height: 1.5;
            color: #212529;
            margin: 0;
        }
        .description-text a {
            color: #007bff;
            text-decoration: none;
            word-break: break-word; /* Evita que enlaces largos rompan el diseño */
        }
        .description-text a:hover {
            text-decoration: underline;
        }

        .description-text-bold {
            font-size: 20px;
            line-height: 1.5;
            color: #212529;
            margin: 0;
        }

        .description-text-bold strong {
            font-weight: bold;
        }

        .description-text-bold a {
            color: #007bff;
            text-decoration: none;
        }
        .description-text-bold a:hover {
            text-decoration: underline;
        }

        /* Específica para los nombres */
        .names-title {
            font-size: 26px;
            margin: 0; /* Eliminado el margin-top negativo que rompía el diseño */
        }

        /* ==========================================
           MEDIA QUERY: Para Pantallas Grandes (PC/Tablets)
           ========================================== */
        @media (min-width: 768px) {
            body {
                padding: 40px;
            }

            .card {
                flex-direction: row; /* Volvemos al diseño de dos columnas al lado del otro */
                padding: 40px;
                gap: 40px;
            }

            .image-column {
                flex: 0 0 55%; /* 55% de ancho solo en pantallas grandes */
            }

            .content-column {
                flex: 0 0 45%; /* 45% de ancho solo en pantallas grandes */
                padding-right: 20px;
            }

            .description-text {
                font-size: 18px;
            }

            .description-text-bold {
                font-size: 22px;
            }

            .names-title {
                font-size: 33px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="image-column">
        <img class="main-image" src="boda.png" alt="Main Display Image">
    </div>

    <div class="content-column">
        <p class="description-text-bold names-title">
            <strong>Mary y Andrés</strong>
        </p>
        
        <p class="description-text">
            El 23 de octubre no hagan planes que ya los hemos hecho nosotros por ustedes.
        </p>
        
        <p class="description-text-bold">
            <strong>¡¡Nos casamos!!</strong>
        </p>

        <p class="description-text">
            El bodorrio será a las 13:00h <br>
            <a href="https://maps.app.goo.gl/ZgvS9oYbp6UapUuw8" target="_blank">
                C/ Concepción Salazar 33, La Laguna
            </a>
        </p>

        <p class="description-text">
            *No queremos regalo, el regalo eres tú.
        </p>
    </div>
</div>

</body>
</html>
